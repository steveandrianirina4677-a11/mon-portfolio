
<!doctype html>
<html lang="fr">
  <head>
    <!-- Encodage des caractères pour afficher correctement les accents -->
    <meta charset="UTF-8" />

    <!-- Adaptation du site aux téléphones, tablettes et ordinateurs -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Icône du site -->
    <link rel="icon" type="image/png" href="/steve.png" />

    <!-- Empêcher la traduction automatique -->
    <meta name="google" content="notranslate" />

    <!-- Vérification de propriété Google Search Console -->
    <meta
      name="google-site-verification"
      content="e6PWBYsXHCvocSTDC11ft0DgVAWFj5rdyyDxXVOvfYY"
    />

    <!-- Titre SEO : nom et activité professionnelle -->
    <title>
      Steve Andrianirina | Développeur Web et Logiciel à Madagascar
    </title>

    <!-- Description SEO pour les résultats de recherche Google -->
    <meta
      name="description"
      content="Steve Andrianirina, développeur web et logiciel à Madagascar. Découvrez mes compétences en JavaScript, Python, React et MySQL, mes réalisations et mes solutions numériques sur mesure."
    />

    <!-- Nom de l'auteur du site -->
    <meta name="author" content="Steve Andrianirina" />

    <!-- Autoriser les moteurs de recherche à indexer la page -->
    <meta name="robots" content="index, follow" />

    <!-- Adresse officielle du site pour éviter les doublons -->
    <link
      rel="canonical"
      href="https://steve-portfolio-2026.pages.dev/"
    />

    <!-- Informations de partage sur Facebook, LinkedIn et autres réseaux -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />

    <meta
      property="og:title"
      content="Steve Andrianirina | Développeur Web et Logiciel"
    />

    <meta
      property="og:description"
      content="Développeur web et logiciel à Madagascar. JavaScript, Python, React, MySQL et création de solutions numériques sur mesure."
    />

    <meta
      property="og:url"
      content="https://steve-portfolio-2026.pages.dev/"
    />

    <meta
      property="og:site_name"
      content="Steve Andrianirina"
    />

    <!-- Configuration de l'aperçu des liens sur X (Twitter) -->
    <meta name="twitter:card" content="summary" />

    <meta
      name="twitter:title"
      content="Steve Andrianirina | Développeur Web et Logiciel"
    />

    <meta
      name="twitter:description"
      content="Développeur web et logiciel à Madagascar : JavaScript, Python, React, MySQL et solutions numériques sur mesure."
    />
  </head>

  <body>
    <!-- Zone principale dans laquelle React affiche le site -->
    <div id="root"></div>

    <!-- Chargement de l'application React -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
